<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Organizador de Respostas</title>
  <link rel="stylesheet" href="../estilos/style.css" />
  <link rel="stylesheet" href="../estilos/fca.css">
</head>
<body>
  <header>
    <a href="../index.html"><img src="../imagens/logo.png" alt="Logo Intelbras" /></a>
    <nav>
      <ul>
        <li><a href="senhas.html">🔐 Recuperação de Senha</a></li>
        <li><a href="">📋 Atendimentos Gerais</a></li>
        <li><a href="">✉️ E-mail</a></li>
        <li style="background-color: white;"><a href="">🧠 FCA</a></li>
        <li><a href="">⚙️ Processos Internos</a></li>
        <li><a href="">🖼️ Galeria de Fotos</a></li>
        <li><a href="organizador.html">💬 Organizador de Respostas</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="ferramenta">
      <h1>🧠 Gerador de FCA</h1>

      <div class="modelo">
        <label for="modelo">Modelo:</label>
        <textarea id="modelo" placeholder="Digite o modelo..."></textarea>
      </div>

      <div class="fato">
        <label for="fato">Fato:</label>
        <textarea id="fato" placeholder="Digite o fato..."></textarea>
        <ul id="sugestoes-fato" class="sugestoes"></ul>
      </div>

      <div class="causa">
        <label for="causa">Causa:</label>
        <textarea id="causa" placeholder="Digite a causa..."></textarea>
        <ul id="sugestoes-causa" class="sugestoes"></ul>
      </div>

      <div class="acao">
        <label for="acao">Ação:</label>
        <textarea id="acao" placeholder="Digite a ação..."></textarea>
      </div>

      <div class="info">
        <label for="info">Informações adicionais:</label>
        <textarea id="info" placeholder="Digite as informações adicionais... (Modelo/Firmware/Versão/Contato com cliente)"></textarea>
      </div>

      <div class="botao">
        <button id="criar_fca" onclick="criarFCA()">Criar FCA</button>
        <button id="limpar" onclick="limparCampos()">Limpar</button>
        <p id="mensagem"></p>
      </div>

      <div id="resultado"></div>
    </section>
  </main>

  <script src="../scripts/gerador_fca.js"></script>
</body>
</html>
